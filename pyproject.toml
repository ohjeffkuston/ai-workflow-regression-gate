[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-regression-gate"
version = "1.0.0"
description = "Deterministic, approval-first regression testing for AI and n8n workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jeffrey Ikuoyemwen"}]

[project.scripts]
ai-workflow-regression-gate = "ai_workflow_regression_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

